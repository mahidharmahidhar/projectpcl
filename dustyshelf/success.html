<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Confirmed — DustyShelf</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { parchment: '#FDFCF8', ink: '#1A1A1A', forest: '#1A3C34', gold: '#B8860B', clay: '#7D6B5D' },
          fontFamily: { serif: ['"Playfair Display"', 'serif'], sans: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>
  <style>
    .serif { font-family: 'Playfair Display', serif; }
    @keyframes checkmark-draw { from { stroke-dashoffset: 56; } to { stroke-dashoffset: 0; } }
    @keyframes circle-draw { from { stroke-dashoffset: 283; } to { stroke-dashoffset: 0; } }
    @keyframes fade-up { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes confetti-fall {
      0%   { transform: translateY(-20px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(80px) rotate(720deg); opacity: 0; }
    }
    .fade-up { animation: fade-up 0.6s ease forwards; }
    .fade-up-delay-1 { animation: fade-up 0.6s 0.2s ease forwards; opacity: 0; }
    .fade-up-delay-2 { animation: fade-up 0.6s 0.4s ease forwards; opacity: 0; }
    .fade-up-delay-3 { animation: fade-up 0.6s 0.6s ease forwards; opacity: 0; }
  </style>
</head>
<body class="bg-parchment text-ink min-h-screen flex items-center justify-center p-8 relative overflow-hidden">

  <!-- Confetti particles -->
  <div id="confetti" class="fixed inset-0 pointer-events-none z-0"></div>

  <div class="max-w-xl w-full text-center relative z-10">
    
    <!-- Animated Checkmark -->
    <div class="fade-up mb-8">
      <svg viewBox="0 0 100 100" class="w-24 h-24 mx-auto">
        <circle cx="50" cy="50" r="45" fill="none" stroke="#1A3C34" stroke-width="2.5"
                stroke-dasharray="283" stroke-dashoffset="283"
                style="animation: circle-draw 0.7s 0.2s ease forwards;" />
        <path d="M30 52 L44 66 L70 38" fill="none" stroke="#B8860B" stroke-width="4"
              stroke-linecap="round" stroke-linejoin="round"
              stroke-dasharray="56" stroke-dashoffset="56"
              style="animation: checkmark-draw 0.5s 0.8s ease forwards;" />
      </svg>
    </div>
    
    <div class="bg-white p-10 sm:p-12 rounded-[3rem] border border-gray-100 shadow-lg mb-10">
      <h1 id="success-title" class="fade-up serif text-4xl sm:text-5xl font-bold text-forest mb-4">Order Placed<br/>Successfully</h1>
      <p id="success-subtitle" class="fade-up-delay-1 text-clay text-base sm:text-lg mb-8 leading-relaxed italic">The stories you've chosen are being curated and packaged with care for their next journey.</p>
      
      <!-- Payment status badge -->
      <div id="payment-badge" class="fade-up-delay-1 hidden mb-6">
        <span id="badge-text" class="inline-flex items-center gap-2 px-6 py-3 rounded-full text-xs font-bold uppercase tracking-widest"></span>
      </div>

      <div id="summary" class="fade-up-delay-2 bg-parchment p-6 sm:p-8 rounded-3xl border border-gray-50 text-left mb-8">
        <p class="text-[10px] font-black uppercase tracking-widest text-clay mb-4">Order Summary</p>
        <div id="item-list" class="space-y-2 mb-4"></div>
        <div class="border-t border-gray-100 pt-4 flex justify-between font-bold text-forest serif text-xl">
          <span id="amount-label">Amount</span>
          <span id="paid">&#8377;0</span>
        </div>
      </div>

      <div class="fade-up-delay-3 flex flex-col sm:flex-row gap-3 justify-center">
        <a href="index.html" class="inline-block bg-forest text-parchment px-10 py-4 rounded-full font-bold text-xs uppercase tracking-widest hover:scale-105 transition-all shadow-xl shadow-forest/10">
          Continue Shopping
        </a>
        <a href="dashboard.html" class="inline-block bg-gold/10 text-gold border border-gold px-10 py-4 rounded-full font-bold text-xs uppercase tracking-widest hover:bg-gold hover:text-parchment transition-all">
          View My Orders
        </a>
      </div>
    </div>

    <p class="text-clay/60 text-[10px] font-bold uppercase tracking-[0.3em]">DustyShelf Collective &#183; Est. 2024</p>
  </div>

  <script type="module">
    import { showToast } from './js/toast.js';

    // Generate confetti
    const confettiEl = document.getElementById('confetti');
    const colors = ['#B8860B', '#1A3C34', '#4ade80', '#fbbf24', '#f87171', '#60a5fa', '#a78bfa', '#fb923c'];
    for (let i = 0; i < 40; i++) {
      const div = document.createElement('div');
      const color = colors[i % colors.length];
      const left = Math.random() * 100;
      const delay = Math.random() * 1.5;
      const size = 5 + Math.random() * 8;
      div.style.cssText = `
        position: absolute; top: -10px; left: ${left}%;
        width: ${size}px; height: ${size}px;
        border-radius: ${Math.random() > 0.5 ? '50%' : '2px'};
        background: ${color};
        animation: confetti-fall ${1.5 + Math.random() * 2}s ${delay}s ease-out forwards;
        opacity: 0;
      `;
      confettiEl.appendChild(div);
    }

    // Populate order data based on payment method
    const lastOrder = JSON.parse(localStorage.getItem("last_order"));
    if (lastOrder) {
      document.getElementById("paid").innerHTML = `&#8377;${lastOrder.total.toLocaleString("en-IN")}`;
      document.getElementById("item-list").innerHTML = lastOrder.items.map(i => `
        <div class="flex justify-between text-xs">
          <span class="text-clay italic truncate pr-4">${i.title} &#215; ${i.qty}</span>
          <span class="font-bold">&#8377;${(i.price * i.qty).toLocaleString("en-IN")}</span>
        </div>
      `).join("");

      // Show payment-specific messaging
      const badge = document.getElementById("payment-badge");
      const badgeText = document.getElementById("badge-text");

      if (lastOrder.paymentStatus === "Pending Verification") {
        document.getElementById("success-title").innerHTML = "Payment<br/>Submitted!";
        document.getElementById("success-subtitle").textContent = "Your payment screenshot has been uploaded. Our team will verify it within a few hours.";
        document.getElementById("amount-label").textContent = "Amount Paid via UPI";
        badge.classList.remove("hidden");
        badgeText.textContent = "⏳ Pending Verification";
        badgeText.className = "inline-flex items-center gap-2 px-6 py-3 rounded-full text-xs font-bold uppercase tracking-widest bg-orange-50 text-orange-600 border border-orange-200";
      } else if (lastOrder.paymentMethod === "COD") {
        document.getElementById("success-subtitle").textContent = "Your order is confirmed! Pay when your books arrive at your doorstep.";
        document.getElementById("amount-label").textContent = "Amount Due (COD)";
        badge.classList.remove("hidden");
        badgeText.textContent = "💵 Cash on Delivery";
        badgeText.className = "inline-flex items-center gap-2 px-6 py-3 rounded-full text-xs font-bold uppercase tracking-widest bg-blue-50 text-blue-600 border border-blue-200";
      }

      setTimeout(() => {
        showToast("Order placed! Check your dashboard for updates.", "success", 5000);
      }, 1000);
    } else {
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
