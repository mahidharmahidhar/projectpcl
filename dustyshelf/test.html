<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Firebase Connection Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white flex flex-col items-center justify-center h-screen">
    <div class="bg-gray-900 p-8 rounded-2xl border border-gray-800 text-center shadow-xl">
        <h1 class="text-2xl font-bold mb-4">Firebase Write Test</h1>
        <p id="status" class="text-gray-400 mb-6">Click the button below to test writing to Firestore.</p>
        
        <button id="test-btn" class="bg-green-600 hover:bg-green-500 px-8 py-3 rounded-xl font-bold transition-all">
            Run Write Test
        </button>

        <div id="result" class="mt-6 hidden p-4 bg-black/50 rounded-lg text-sm text-left font-mono"></div>
    </div>

    <script type="module">
        import { db } from "./js/firebase-config.js";
        import { collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        document.getElementById('test-btn').addEventListener('click', async () => {
            const status = document.getElementById('status');
            const result = document.getElementById('result');
            const btn = document.getElementById('test-btn');

            status.textContent = "Writing to Firestore...";
            btn.disabled = true;
            btn.classList.add('opacity-50');

            try {
                // Test Writing Data as requested
                const docRef = await addDoc(collection(db, "books"), {
                    title: "Second Hand Book (Test)",
                    price: 200,
                    createdAt: new Date()
                });

                status.textContent = "✅ Success!";
                result.classList.remove('hidden');
                result.textContent = `Document written with ID: ${docRef.id}`;
                console.log("Document written with ID: ", docRef.id);
            } catch (e) {
                status.textContent = "❌ Error writing document";
                result.classList.remove('hidden');
                result.textContent = `Error: ${e.message}\n\nMake sure your API keys in js/firebase-config.js are correct and Firestore rules are set to public.`;
                console.error("Error adding document: ", e);
            } finally {
                btn.disabled = false;
                btn.classList.remove('opacity-50');
            }
        });
    </script>
</body>
</html>
